# structure_media — RTS audio configuration
#
# Audio collection: each issue's `ext` is .mp3, so the script auto-routes
# through the audio pipeline (mp3 copy, IIIF Presentation 3 manifest emit,
# {PROVIDER}/{alias}/{date}/{edition}/ on-disk layout).
#
#   impresso-structure-media --config facsimile_config/config.rts.yaml
#   impresso-structure-media --config facsimile_config/config.rts.yaml --dry_run=False

# --- Paths ---

# RTS issue index (alias > year > month > issues; ext = .mp3).
issues_json_path: /rcp-scratch/journe/impresso-acquisition/issue_indices/issue_index.rts.json

# Provider-specific access-rights — required for audio (consumed by the
# IIIF manifest's content_bitmaps).
access_rights_path: /rcp-scratch/journe/impresso-acquisition/access_rights_masterfiles/access_rights.rts.json

# Read-only source mount.
source_base_dir: /mnt/project_impresso/original

# Kind root for the writable audio output. The script appends `/RTS`
# internally (derived from issues_json_path) so the on-disk layout becomes
# /mnt/project_impresso_rw/audios/RTS/{alias}/{date}/{edition}/, mirroring
# the IIIF URL .../media/audio/RTS/{alias}/{date}/{edition}. The augmented
# issue_index lands at /mnt/project_impresso_rw/audios/issue_index/ (kind
# root, alongside any future image-side index).
target_base_dir: /mnt/project_impresso_rw/audios

# --- Filtering ---

# Empty = all RTS aliases.
aliases_include: []
aliases_exclude: []

# --- Behaviour ---

# Real-run mode for this RTS config. Set back to `true` (or pass
# --dry_run on the CLI) to inspect without writing.
dry_run: false

sample: 0
overwrite: false
delete_source: false

# --- Performance ---

workers: 1

# --- Output / Logging ---

log_level: INFO

# One log file + one report directory per run, named under the provider.
log_file:          /rcp-scratch/journe/experiments/copy_media/logs/rts/run1.log
report_dir:        /rcp-scratch/journe/experiments/copy_media/reports/rts/run1

# In-place resume: rereading the same report dir before appending lets a
# retry skip already-succeeded issues without growing the files.
prior_report_dir:  /rcp-scratch/journe/experiments/copy_media/reports/rts/run1
retry_failed_only: false
