# structure_facsimiles — example configuration
#
# Copy this file, adjust paths and filters, then run:
#   impresso-structure-facsimiles --config my_config.yaml
#   impresso-structure-facsimiles --config my_config.yaml --dry_run=False

# --- Paths ---

# JSON file listing all issues for the collection (alias > year > month > issues).
issues_json_path: /path/to/issues_to_ingest.json

# Root of source data (read-only mount is fine).
source_base_dir: /mnt/project_impresso/original

# Root of the writable image output. Must be the rw mount, NOT the read-only
# /mnt/project_impresso/images.
target_base_dir: /mnt/impresso_images

# --- Filtering ---

# Process only these aliases (empty = all).
aliases_include: []
#  - BLB
#  - actionfem

# Skip these aliases (applied after aliases_include).
aliases_exclude: []

# --- Behaviour ---

# SAFE DEFAULT: no files written. Set to false to actually process.
dry_run: true

# Process only the first N issues end-to-end (with actual writes).
# Useful to smoke-test conversions before a full run. Overrides dry_run.
# 0 = disabled (default).
sample: 0

# Delete source image files after verified copy. NOT YET IMPLEMENTED — ignored.
delete_source: false

# --- Performance ---

# Number of threads for parallel page conversion within each issue.
# 1 = sequential (default); higher values convert pages concurrently via
# opj_compress subprocesses. Typical sweet spot: number of CPU cores.
workers: 1

# --- Output / Logging ---

# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL (default: INFO).
log_level: INFO

# Log file path (empty = log to stdout).
log_file: ""

# Processing report (JSONL). Tracks successes, failures, skips.
report_file: ""

# Prior report to resume from. Issues marked "success" in this file are skipped.
# Can be the same path as report_file — in that case the script reads existing
# entries before appending, and only writes a new line when the status changes
# (e.g. failed → success on retry). This keeps the file from growing on re-runs.
prior_report_file: ""

# When true AND prior_report_file is set: only re-process issues that were
# "failed" in the prior report. Ignores new and skipped issues.
retry_failed_only: false
